<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#070a16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="DIGO EVOLUTION - a fast-paced 3D arcade survival game. Collect rewards, dodge hazards, evolve DIGO across seven worlds."
    />
    <title>DIGO EVOLUTION</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ffcf3f'/%3E%3Ccircle cx='32' cy='32' r='23' fill='%23b47a00'/%3E%3Cpath d='M24 18h10c10 0 16 5.6 16 14s-6 14-16 14H24z' fill='%23fff3c4'/%3E%3C/svg%3E" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #070a16;
        overscroll-behavior: none;
      }
      body {
        -webkit-tap-highlight-color: transparent;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 30%, #18224a 0%, #070a16 70%);
        color: #ffe9a8;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 13px;
        z-index: 999;
      }
      #boot .ring {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 3px solid rgba(255, 207, 63, 0.25);
        border-top-color: #ffcf3f;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="ring"></div><div>Loading DIGO EVOLUTION</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
